<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="FocusFlow Pro — Modern görev yönetimi ve odaklanma aracı. Günlük & haftalık planlama, Pomodoro zamanlayıcı, analiz paneli." />
  <title>FocusFlow Pro — Akıllı Görev Yöneticisi</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ai-chat.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
</head>

<body>
  <div class="app-container">

    <!-- ====== SIDEBAR ====== -->
    <aside class="sidebar" id="sidebar">
      <!-- Rendered by Sidebar.js -->
    </aside>

    <!-- ====== MAIN CONTENT ====== -->
    <main class="main-content">

      <!-- Header -->
      <header class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-md);">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <h2 id="page-title">📋 Bugünün Görevleri</h2>
        </div>
        <div class="header-actions">
          <div class="theme-picker-wrapper" id="theme-picker-wrapper">
            <button class="theme-toggle" id="theme-toggle" title="Tema değiştir">🎨</button>
          </div>
        </div>
      </header>

      <!-- Page Views -->
      <div class="page-content">
        <div class="page-view active" id="page-daily"></div>
        <div class="page-view" id="page-weekly"></div>
        <div class="page-view" id="page-pomodoro"></div>
        <div class="page-view" id="page-habits"></div>
        <div class="page-view" id="page-analytics"></div>
        <div class="page-view" id="page-badges"></div>
        <div class="page-view" id="page-schedule"></div>
      </div>

      <!-- Motivation Bar -->
      <footer class="motivation-bar">
        <span id="motivation-text">Sadece başla, gerisi gelecek. 🚀</span>
      </footer>

    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>

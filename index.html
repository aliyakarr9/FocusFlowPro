<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="TDAPP: görevler, Pomodoro, alışkanlıklar ve ders programı tek yerde." />
  <title>TDAPP</title>
  <script>
    // Son kullanılan görünümü ilk boyamadan önce uygula
    try {
      var a = JSON.parse(localStorage.getItem('tdapp-appearance') || 'null');
      if (a) {
        var dark = a.theme === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : a.theme !== 'light';
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-accent', a.accent || 'tomato');
      }
    } catch (e) { }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ai-chat.css" />
  <link rel="stylesheet" href="css/pomodoro.css" />
  <link rel="stylesheet" href="css/habits.css" />
  <link rel="stylesheet" href="css/analytics.css" />
  <link rel="stylesheet" href="css/schedule.css" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23cc4125'/></svg>" />
</head>

<body>
  <div class="app-container">

    <aside class="sidebar" id="sidebar">
    </aside>

    <main class="main-content">

      <header class="page-header">
        <div class="page-heading">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menüyü aç"></button>
          <div>
            <h2 id="page-title">Bugün</h2>
            <div class="page-subtitle" id="page-subtitle"></div>
          </div>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="shortcuts-btn" title="Klavye kısayolları (?)" aria-label="Klavye kısayolları"></button>
          <div class="appearance-wrapper" id="appearance-wrapper">
            <button class="theme-toggle" id="theme-toggle" title="Görünüm" aria-label="Görünüm" aria-haspopup="true" aria-expanded="false"></button>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div class="page-view active" id="page-daily"></div>
        <div class="page-view" id="page-weekly"></div>
        <div class="page-view" id="page-pomodoro"></div>
        <div class="page-view" id="page-habits"></div>
        <div class="page-view" id="page-analytics"></div>
        <div class="page-view" id="page-badges"></div>
        <div class="page-view" id="page-schedule"></div>
      </div>

      <footer class="motivation-bar">
        <span id="motivation-text">Sadece başla, gerisi gelecek.</span>
      </footer>

    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>

</html>
